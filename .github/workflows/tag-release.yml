name: Tag Release on Push

# 每次 push 到 release（例如手動把 main merge 進 release），直接讀當下
# pubspec.yaml 裡的版本號，打一個對應的 git tag 推上去。版本號一樣完全
# 由人決定，這支 workflow 只負責打 tag，邏輯跟 tag-main.yml 完全對稱。

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the current version
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version: ' pubspec.yaml | sed -E 's/^version: *//')
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
